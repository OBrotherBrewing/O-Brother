name: Publish
# Approving a story = merging its pull request. This stamps the editor's name, then deploys.
on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths: ["templates/**", "static/**", "config/site.yaml", "content/pages/**", "gnn/site.py"]
  workflow_dispatch:
concurrency: { group: publish, cancel-in-progress: false }
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  finalize:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'story'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.repository.default_branch }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Record the approval
        if: github.event_name == 'pull_request'
        run: |
          python -m gnn finalize --editor "${{ github.event.pull_request.merged_by.login }}"
          git config user.name "newsroom-bot"; git config user.email "newsroom-bot@users.noreply.github.com"
          git add content data && git commit -m "Approved by ${{ github.event.pull_request.merged_by.login }}: ${{ github.event.pull_request.title }} [skip ci]" || true
          git push
  deploy:
    needs: finalize
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
