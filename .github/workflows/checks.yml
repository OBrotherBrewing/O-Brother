name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: python -m pytest -q
      - name: Audit log intact
        run: python -m gnn audit
      - name: Site builds (including stories in this pull request)
        run: python -m gnn build --include-pending --out preview
      - uses: actions/upload-artifact@v4
        with: { name: preview-site, path: preview, retention-days: 7 }
