# Pipeline behaviour. Change thresholds here, never in code.

editorial:
  # review_all: every story waits for a named editor (Mode A, claims the AI Act Art 50(4) exemption).
  # auto_low_risk: low-risk stories that pass every check publish with an AI-generated label (Mode B).
  # Launch in review_all. Switch only after the 100-story pilot meets the targets in docs/RUNBOOK.md.
  mode: review_all
  auto_publish:
    min_positivity: 70
    max_risk: 15
    min_independent_sources: 2
    allow_single_tier1_primary: true      # one official/peer-reviewed primary source can stand alone
    first_n_per_source_reviewed: 20
  always_human_topics:
    - health_claim
    - medical
    - legal
    - financial_advice
    - crime
    - children
    - private_individual
    - elections
    - conflict
    - allegation
  hype_words: [first, cure, cured, eradicated, breakthrough, miracle, revolutionary, game-changer, game changer, guaranteed, proven, "100%", never before, world's first]
  queue_expiry_hours: 48

volumes:
  max_candidates_per_run: 60
  max_drafts_per_run: 6
  max_published_per_day: 15

llm:
  provider: anthropic
  # One model for every stage, tuned with effort, is the simplest setup to evaluate.
  # Cheaper routing (e.g. claude-haiku-4-5 for triage) is a decision for after the pilot eval.
  default_model: claude-opus-5-5
  fallbacks: default                     # server-side refusal fallback; set to "" to disable
  stages:
    triage:     {model: claude-opus-5-5, effort: low,    max_tokens: 4000}
    extract:    {model: claude-opus-5-5, effort: medium, max_tokens: 16000}
    score:      {model: claude-opus-5-5, effort: low,    max_tokens: 4000}
    draft:      {model: claude-opus-5-5, effort: medium, max_tokens: 16000}
    factcheck:  {model: claude-opus-5-5, effort: high,   max_tokens: 16000}
    social:     {model: claude-opus-5-5, effort: low,    max_tokens: 4000}
  # USD per million tokens, used for the cost log (check https://platform.claude.com/docs/en/about-claude/pricing)
  prices_usd_per_mtok:
    claude-opus-5-5:   {input: 4.0, output: 20.0, cache_read: 0.20, cache_write: 5.0}
    claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.20, cache_write: 2.5}
    claude-haiku-4-5:  {input: 1.0, output: 5.0,  cache_read: 0.10, cache_write: 1.25}
  usd_to_eur: 0.891
  daily_spend_cap_eur: 10.0
  per_story_cap_eur: 1.50

fetch:
  user_agent: "GoodNewsNewsBot/0.1 (+https://example.com/about/how-we-work)"
  timeout_seconds: 20
  respect_robots: true
  respect_tdm_reservation: true
  max_bytes: 3000000

monitor:
  recheck_after_hours: [6, 24, 168, 720]
